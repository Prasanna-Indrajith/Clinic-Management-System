# Podman Compose / Docker Compose specification
# Run locally with: podman compose up --build (or podman-compose up)

services:
  # PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: clinic_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: clinic_tracker
      POSTGRES_USER: clinic_user
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic_user -d clinic_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - clinic_net

  # Backend REST API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clinic_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_DIALECT: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: clinic_tracker
      DB_USER: clinic_user
      DB_PASS: changeme
      JWT_SECRET: replace_with_a_long_random_secret_at_least_64_chars_for_prod
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGINS: http://localhost,http://localhost:80,http://localhost:5173,http://frontend
    ports:
      - "5000:5000"
    networks:
      - clinic_net

  # Frontend Web UI (Nginx SPA + Reverse Proxy)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clinic_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - clinic_net

volumes:
  postgres_data:
    driver: local

networks:
  clinic_net:
    driver: bridge
