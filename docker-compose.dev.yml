# Podman / Docker Compose specification for Local Development & Testing
# Run with: podman compose -f docker-compose.dev.yml up --build

services:
  # PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: clinic_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: clinic_tracker
      POSTGRES_USER: clinic_user
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic_user -d clinic_tracker"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - clinic_dev_net

  # Backend REST API Service (Live Nodemon Reloading)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: clinic_backend_dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_DIALECT: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: clinic_tracker
      DB_USER: clinic_user
      DB_PASS: changeme
      JWT_SECRET: dev_secret_key_clinic_appointment_tracker_jwt_2026
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGINS: http://localhost:5173,http://localhost:5000,http://frontend:5173
    volumes:
      - ./backend:/app:z
      - backend_node_modules:/app/node_modules
    ports:
      - "5000:5000"
    command: npm run dev
    networks:
      - clinic_dev_net

  # Frontend Web UI (Vite Dev Server with Hot Module Replacement)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: clinic_frontend_dev
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./frontend:/app:z
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0
    networks:
      - clinic_dev_net

volumes:
  postgres_dev_data:
    driver: local
  backend_node_modules:
  frontend_node_modules:

networks:
  clinic_dev_net:
    driver: bridge
